<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Cagar Budaya Lanskap Indonesia</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f5f5; color: #333; }

    .header {
      background: #2c5f2e;
      color: white;
      padding: 24px 20px;
      text-align: center;
    }
    .header h1 { font-size: 22px; font-weight: 600; margin-bottom: 6px; }
    .header p { font-size: 13px; opacity: 0.85; }

    .controls {
      background: white;
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .controls input, .controls select {
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 13px;
      background: #fafafa;
    }
    .controls input { flex: 1; min-width: 160px; }

    .stats {
      padding: 10px 16px;
      font-size: 12px;
      color: #888;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
      padding: 10px 16px 24px;
    }

    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.12); }

    .card-img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background: #e8e8e8;
      display: block;
    }
    .card-img-placeholder {
      width: 100%;
      height: 150px;
      background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    .card-body { padding: 12px; }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #222;
      margin-bottom: 6px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta { display: flex; flex-direction: column; gap: 4px; }
    .badge {
      display: inline-block;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 500;
      width: fit-content;
    }
    .badge-cb { background: #e8f5e9; color: #2e7d32; }
    .badge-diduga { background: #fff3e0; color: #e65100; }
    .badge-nas { background: #e3f2fd; color: #1565c0; }
    .badge-prov { background: #f3e5f5; color: #6a1b9a; }
    .badge-kota { background: #fce4ec; color: #880e4f; }
    .card-lokasi { font-size: 11px; color: #888; margin-top: 4px; }
    .card-sumber { font-size: 10px; color: #aaa; margin-top: 4px; }

    .loading { text-align: center; padding: 60px 20px; color: #888; font-size: 14px; }
    .empty { text-align: center; padding: 60px 20px; color: #aaa; font-size: 14px; }

    /* Modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: white;
      border-radius: 16px;
      max-width: 480px;
      width: 100%;
      overflow: hidden;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-img { width: 100%; height: 220px; object-fit: cover; }
    .modal-img-placeholder {
      width: 100%; height: 220px;
      background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
      display: flex; align-items: center; justify-content: center;
      font-size: 48px;
    }
    .modal-body { padding: 20px; }
    .modal-title { font-size: 18px; font-weight: 600; margin-bottom: 12px; }
    .modal-row { display: flex; gap: 8px; margin-bottom: 8px; font-size: 13px; }
    .modal-label { color: #888; min-width: 100px; }
    .modal-val { color: #333; }
    .modal-close {
      position: absolute;
      top: 12px; right: 12px;
      background: white;
      border: none;
      border-radius: 50%;
      width: 32px; height: 32px;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .modal-wrapper { position: relative; }
  </style>
</head>
<body>

<div class="header">
  <h1>Cagar Budaya Lanskap Indonesia</h1>
  <p>Direktori digital situs dan kawasan budaya di seluruh Indonesia</p>
</div>

<div class="controls">
  <input type="text" id="search" placeholder="Cari nama cagar budaya..." oninput="filterGallery()" />
  <select id="filter-status" onchange="filterGallery()">
    <option value="">Semua status</option>
    <option value="Cagar Budaya">Cagar Budaya</option>
    <option value="Diduga Cagar Budaya">Diduga Cagar Budaya</option>
  </select>
  <select id="filter-tingkat" onchange="filterGallery()">
    <option value="">Semua tingkat</option>
  </select>
</div>

<div class="stats" id="stats">Memuat data...</div>
<div class="gallery" id="gallery"><div class="loading">Memuat data cagar budaya...</div></div>

<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal-wrapper">
    <button class="modal-close" onclick="closeModal()">×</button>
    <div class="modal" id="modal-content"></div>
  </div>
</div>

<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR_4TS9oY6VhuCP9GQVVmDiLdOovqns7HtLwvt0motuk6hEgRvOLYEeMdE4hPiaNZTlSthFrGI4UufQ/pub?output=csv&cachebust=" + Date.now();

let allData = [];

function parseCSV(text) {
  const lines = text.split('\n');
  const headers = lines[0].split(',').map(h => h.trim().replace(/"/g, ''));
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const values = [];
    let current = '';
    let inQuotes = false;
    for (let c = 0; c < lines[i].length; c++) {
      if (lines[i][c] === '"') inQuotes = !inQuotes;
      else if (lines[i][c] === ',' && !inQuotes) { values.push(current.trim()); current = ''; }
      else current += lines[i][c];
    }
    values.push(current.trim());
    if (values.length >= 2) {
      const obj = {};
      headers.forEach((h, idx) => obj[h] = values[idx] || '');
      rows.push(obj);
    }
  }
  return rows;
}

function statusBadge(s) {
  if (!s) return '';
  return s.includes('Diduga')
    ? `<span class="badge badge-diduga">Diduga CB</span>`
    : `<span class="badge badge-cb">Cagar Budaya</span>`;
}

function tingkatBadge(t) {
  if (!t) return '';
  if (t.includes('Nasional')) return `<span class="badge badge-nas">Nasional</span>`;
  if (t.includes('Provinsi')) return `<span class="badge badge-prov">Provinsi</span>`;
  if (t.includes('Kota') || t.includes('Kabupaten')) return `<span class="badge badge-kota">Kota/Kab</span>`;
  return `<span class="badge badge-nas">${t}</span>`;
}

function imgEl(url, cls) {
  if (url && url.startsWith('http')) {
    return `<img class="${cls}" src="${url}" alt="foto" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" /><div class="${cls}-placeholder" style="display:none">🏛️</div>`;
  }
  return `<div class="${cls === 'card-img' ? 'card-img-placeholder' : 'modal-img-placeholder'}">🏛️</div>`;
}

function renderGallery(data) {
  const gallery = document.getElementById('gallery');
  if (data.length === 0) {
    gallery.innerHTML = '<div class="empty">Tidak ada data yang ditemukan</div>';
    return;
  }
  gallery.innerHTML = data.map((d, i) => `
    <div class="card" onclick="openModal(${allData.indexOf(d)})">
      ${imgEl(d['Gambar'], 'card-img')}
      <div class="card-body">
        <div class="card-title">${d['Nama Kawasan'] || d['name'] || 'Tanpa Nama'}</div>
        <div class="card-meta">
          ${statusBadge(d['Status'])}
          ${tingkatBadge(d['Tingkat'])}
          <div class="card-lokasi">📍 ${d['Lokasi'] || '-'}</div>
        </div>
      </div>
    </div>
  `).join('');
}

function filterGallery() {
  const q = document.getElementById('search').value.toLowerCase();
  const st = document.getElementById('filter-status').value;
  const kt = document.getElementById('filter-tingkat').value;
  const filtered = allData.filter(d => {
    const nama = (d['Nama Kawasan'] || d['name'] || '').toLowerCase();
    return (!q || nama.includes(q)) &&
           (!st || (d['Status'] || '').includes(st)) &&
           (!kt || (d['Tingkat'] || '') === kt);
  });
  document.getElementById('stats').textContent = `Menampilkan ${filtered.length} dari ${allData.length} cagar budaya`;
  renderGallery(filtered);
}

function openModal(idx) {
  const d = allData[idx];
  const modal = document.getElementById('modal-content');
  modal.innerHTML = `
    ${imgEl(d['Gambar'], 'modal-img')}
    <div class="modal-body">
      <div class="modal-title">${d['Nama Kawasan'] || d['name'] || 'Tanpa Nama'}</div>
      <div class="modal-row"><span class="modal-label">Status</span><span class="modal-val">${statusBadge(d['Status'])}</span></div>
      <div class="modal-row"><span class="modal-label">Kategori</span><span class="modal-val">${tingkatBadge(d['Tingkat'])}</span></div>
      <div class="modal-row"><span class="modal-label">Lokasi</span><span class="modal-val">${d['Lokasi'] || '-'}</span></div>
      <div class="modal-row"><span class="modal-label">No. SK</span><span class="modal-val">${d['No. SK'] || d['No.'] || '-'}</span></div>
      ${d['Sumber Gambar'] ? `<div class="modal-row"><span class="modal-label">Sumber foto</span><span class="modal-val" style="font-size:11px">${d['Sumber Gambar']}</span></div>` : ''}
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('active');
}

function closeModal(e) {
  if (!e || e.target === document.getElementById('modal-overlay') || e.target.className === 'modal-close') {
    document.getElementById('modal-overlay').classList.remove('active');
  }
}

// Load data
fetch(CSV_URL)
  .then(r => r.text())
  .then(text => {
    allData = parseCSV(text).filter(d => d['Nama Kawasan'] || d['name']);
    // Populate filter kategori
    const kategoriSet = [...new Set(allData.map(d => d['Tingkat']).filter(Boolean))].sort();
    const sel = document.getElementById('filter-tingkat');
    kategoriSet.forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = k; sel.appendChild(o); });
    filterGallery();
  })
  .catch(() => {
    document.getElementById('gallery').innerHTML = '<div class="empty">Gagal memuat data. Pastikan Google Sheets sudah dipublish.</div>';
  });
</script>
</body>
</html>
